name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spike/viewer/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build

  analyzer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: analyzer/uv.lock
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run pytest -q
