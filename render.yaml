# Render blueprint for the Orbit multiplayer relay. The website stays on Vercel and connects here
# through VITE_RELAY_URL (wss://<this service>/api/play).
services:
  - type: web
    name: codeverse-relay
    runtime: node
    plan: free
    rootDir: viewer
    buildCommand: npm ci --omit=dev --legacy-peer-deps
    startCommand: node server/relay.mjs
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - viewer/server/multiplayer.mjs
        - viewer/server/relay.mjs
        - viewer/server/board.mjs
        - viewer/server/keepWarm.mjs
        - viewer/package.json
        - viewer/package-lock.json
    envVars:
      - key: RELAY_ORIGINS
        value: https://orbit29.vercel.app,https://codeverse-orbit.vercel.app
      - key: NODE_VERSION
        value: "22"
      # Leaderboard store (Upstash Redis, free tier). Without these the boards live in memory and
      # are lost whenever the relay restarts or sleeps.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
