[project]
name = "codeverse"
version = "0.0.1"
description = "Turn any Git repository into a living 3D universe."
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "networkx>=3.3",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "lizard>=1.17",
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "pytest>=8",
]

[project.scripts]
codeverse = "codeverse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
