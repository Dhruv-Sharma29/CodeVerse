<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Codeverse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a33"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf0c2"/>
      <stop offset="1" stop-color="#6ea8ff"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a3ffdb"/>
      <stop offset="1" stop-color="#3d7bff"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cf0c2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7cf0c2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="20" fill="url(#glow)"/>
  <!-- the orbit is a "C" for Codeverse, open toward the commit -->
  <path d="M46.85 46.85 A21 21 0 1 1 46.85 17.15" fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="9" fill="url(#planet)"/>
  <!-- a commit in orbit -->
  <circle cx="53" cy="32" r="4.5" fill="#ff8a65" fill-opacity="0.3"/>
  <circle cx="53" cy="32" r="3" fill="#ff8a65"/>
  <circle cx="12" cy="13" r="1" fill="#fff" fill-opacity="0.7"/>
  <circle cx="52" cy="10" r="0.8" fill="#fff" fill-opacity="0.5"/>
  <circle cx="9" cy="52" r="0.8" fill="#fff" fill-opacity="0.5"/>
</svg>
